name: quran_app
description: A beautifully crafted Qur'an reading and listening mobile application
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  dio: ^5.3.0
  supabase_flutter: ^2.0.0
  just_audio: ^0.9.36
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  go_router: ^12.0.0
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.9
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

